<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Game - Coup</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
    }
    
    .setting-card {
      transition: box-shadow 0.2s ease;
    }
    
    .setting-card:hover {
      box-shadow: 0 4px 12px rgba(239, 68, 68, 0.15);
    }
    
    .toggle-row {
      transition: background-color 0.15s ease;
    }
    
    .toggle-row:hover {
      background-color: rgba(255, 255, 255, 0.04);
    }
    
    /* Custom character colors */
    .bg-ambassador { background-color: #739C7B; }
    .bg-ambassador:hover { background-color: #628a69; }
    .bg-inquisitor { background-color: #EAC01E; }
    .bg-inquisitor:hover { background-color: #d1a819; }
  </style>
</head>
<body class="bg-gradient-to-br from-red-900 via-gray-900 to-black text-white min-h-screen">
  <div class="max-w-3xl mx-auto p-6">
    <!-- Header -->
    <div class="flex justify-between items-center mb-5">
      <h1 class="text-3xl font-bold text-red-500">Create New Game</h1>
      <a href="/lobby.html" class="bg-gray-700 hover:bg-gray-600 px-4 py-2 rounded text-sm">
        ← Back to Lobby
      </a>
    </div>

    <!-- Discovery: how people find/enter this game -->
    <div class="text-xs font-bold text-gray-500 uppercase tracking-wide mb-2">Discovery</div>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-3 mb-4">
      <div class="setting-card bg-gray-800 rounded-lg p-4">
        <label for="gameName" class="text-sm font-bold text-gray-300 mb-2 block">Game Name</label>
        <input
          type="text"
          id="gameName"
          placeholder="e.g. Friday Night Coup"
          maxlength="40"
          oninput="updateSummary()"
          class="w-full p-2.5 bg-gray-700 rounded border border-gray-600 text-white text-sm"
        />
        <p class="text-xs text-gray-500 mt-1.5">Optional — leave blank for a default name</p>
      </div>

      <div class="setting-card bg-gray-800 rounded-lg p-4">
        <label class="toggle-row flex items-center justify-between gap-3 cursor-pointer rounded p-2 -mx-2 -mt-2 mb-2">
          <span class="font-bold text-sm text-gray-300">🔒 Require Password</span>
          <input
            type="checkbox"
            id="passwordEnabled"
            onchange="togglePassword()"
            class="w-5 h-5 cursor-pointer flex-shrink-0"
          />
        </label>
        <input
          type="text"
          id="gamePassword"
          placeholder="4-20 characters"
          maxlength="20"
          disabled
          class="w-full p-2.5 bg-gray-700 rounded border border-gray-600 text-white text-sm disabled:opacity-40 disabled:cursor-not-allowed"
        />
        <p id="passwordHint" class="text-xs text-gray-500 mt-1.5">Anyone with the link can join</p>
      </div>
    </div>

    <!-- Gameplay: settings that change how the match itself plays out -->
    <div class="text-xs font-bold text-gray-500 uppercase tracking-wide mb-2">Gameplay</div>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-3 mb-4">
      <div class="setting-card bg-gray-800 rounded-lg p-4">
        <div class="text-sm font-bold text-gray-300 mb-2">Game Variant</div>
        <div class="flex gap-2">
          <button
            id="inquisitorBtn"
            onclick="setGameMode('inquisitor')"
            class="flex-1 py-2.5 rounded font-bold text-sm bg-inquisitor transition-colors"
          >
            Inquisitor
          </button>
          <button
            id="ambassadorBtn"
            onclick="setGameMode('ambassador')"
            class="flex-1 py-2.5 rounded font-bold text-sm bg-gray-700 hover:bg-gray-600 transition-colors"
          >
            Ambassador
          </button>
        </div>
      </div>

      <div class="setting-card bg-gray-800 rounded-lg p-4">
        <label class="toggle-row flex items-center justify-between gap-3 cursor-pointer rounded p-2 -mx-2 -my-1">
          <span>
            <span class="font-semibold text-sm">👥 Large Games (7-10)</span>
            <span class="text-xs text-gray-500 block">Deck size adjusts automatically</span>
          </span>
          <input type="checkbox" id="allowLargeGames" class="w-5 h-5 cursor-pointer flex-shrink-0" />
        </label>
        <!-- Future: Alliance option goes here -->
      </div>
    </div>

    <!-- Meta: doesn't change the match itself, just the experience around it -->
    <div class="text-xs font-bold text-gray-500 uppercase tracking-wide mb-2">Other Options</div>
    <div class="setting-card bg-gray-800 rounded-lg p-4 mb-4">
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-x-6 gap-y-1">
        <label class="toggle-row flex items-center justify-between gap-3 cursor-pointer rounded p-2 -mx-2">
          <span>
            <span class="font-semibold text-sm">🏆 Ranked</span>
            <span class="text-xs text-gray-500 block">Counts toward stats & Elo</span>
          </span>
          <input type="checkbox" id="rankedMode" checked class="w-5 h-5 cursor-pointer flex-shrink-0" />
        </label>

        <label class="toggle-row flex items-center justify-between gap-3 cursor-pointer rounded p-2 -mx-2">
          <span>
            <span class="font-semibold text-sm">👁️ Spectators</span>
            <span class="text-xs text-gray-500 block">Others can watch the game</span>
          </span>
          <input type="checkbox" id="allowSpectators" checked class="w-5 h-5 cursor-pointer flex-shrink-0" />
        </label>

        <label class="toggle-row flex items-center justify-between gap-3 cursor-pointer rounded p-2 -mx-2">
          <span>
            <span class="font-semibold text-sm">🎭 Anonymous Mode</span>
            <span class="text-xs text-gray-500 block">Random names during play, revealed after</span>
          </span>
          <input type="checkbox" id="anonymousMode" class="w-5 h-5 cursor-pointer flex-shrink-0" />
        </label>

        <div class="toggle-row flex items-center justify-between gap-3 rounded p-2 -mx-2">
          <span class="font-semibold text-sm">💬 Chat Mode</span>
          <select
            id="chatMode"
            class="p-1.5 bg-gray-700 rounded border border-gray-600 text-white cursor-pointer font-semibold text-xs"
          >
            <option value="separate">Separate Chats</option>
            <option value="unified">Unified Chat</option>
            <option value="none">No Chat</option>
          </select>
        </div>
      </div>
    </div>

    <!-- Create Button -->
    <button
      onclick="createGame()"
      class="w-full bg-red-600 hover:bg-red-700 p-4 rounded-lg text-xl font-bold transition-colors"
    >
      🎮 Create Game
    </button>

    <!-- Settings Summary -->
    <div id="settingsSummary" class="mt-4 bg-gray-800 rounded-lg p-3 text-xs text-gray-300">
      <div class="font-bold mb-1.5">Current Settings:</div>
      <div id="summaryText" class="grid grid-cols-1 sm:grid-cols-2 gap-x-4 gap-y-0.5"></div>
    </div>
  </div>

  <script>
    let gameMode = 'inquisitor';

    // Get auth token
    const authToken = localStorage.getItem('coupAuthToken');
    let currentUser = null;

    function setGameMode(mode) {
      gameMode = mode;

      const ambassadorBtn = document.getElementById('ambassadorBtn');
      const inquisitorBtn = document.getElementById('inquisitorBtn');

      if (mode === 'ambassador') {
        ambassadorBtn.className = 'flex-1 py-2.5 rounded font-bold text-sm bg-ambassador transition-colors';
        inquisitorBtn.className = 'flex-1 py-2.5 rounded font-bold text-sm bg-gray-700 hover:bg-gray-600 transition-colors';
      } else {
        ambassadorBtn.className = 'flex-1 py-2.5 rounded font-bold text-sm bg-gray-700 hover:bg-gray-600 transition-colors';
        inquisitorBtn.className = 'flex-1 py-2.5 rounded font-bold text-sm bg-inquisitor transition-colors';
      }

      updateSummary();
    }

    function togglePassword() {
      const enabled = document.getElementById('passwordEnabled').checked;
      const gamePassword = document.getElementById('gamePassword');
      const passwordHint = document.getElementById('passwordHint');

      gamePassword.disabled = !enabled;

      if (enabled) {
        passwordHint.textContent = 'Only people with the password can join';
      } else {
        gamePassword.value = '';
        passwordHint.textContent = 'Anyone with the link can join';
      }

      updateSummary();
    }

    function updateSummary() {
      const summary = [];

      // Game name
      const gameName = document.getElementById('gameName').value.trim();
      summary.push(`✏️ Name: ${gameName || '(default)'}`);

      // Game mode
      summary.push(`📋 Variant: ${gameMode === 'ambassador' ? 'Ambassador (Classic)' : 'Inquisitor (Expansion)'}`);

      // Spectators
      const allowSpectators = document.getElementById('allowSpectators').checked;
      summary.push(`👁️ Spectators: ${allowSpectators ? 'Allowed' : 'Not allowed'}`);

      // Chat
      const chatMode = document.getElementById('chatMode').value;
      let chatLabel;
      if (chatMode === 'none') chatLabel = 'Disabled';
      else if (chatMode === 'separate') chatLabel = 'Separate chats';
      else chatLabel = allowSpectators ? 'Unified chat' : 'Player chat';
      summary.push(`💬 Chat: ${chatLabel}`);

      // Password
      const passwordEnabled = document.getElementById('passwordEnabled').checked;
      summary.push(`🔒 Password: ${passwordEnabled ? 'Required' : 'Not required'}`);

      // Ranked
      const ranked = document.getElementById('rankedMode').checked;
      summary.push(`🏆 Mode: ${ranked ? 'Ranked' : 'Unranked (casual)'}`);

      // Anonymous
      const anonymous = document.getElementById('anonymousMode').checked;
      summary.push(`🎭 Identities: ${anonymous ? 'Anonymous' : 'Visible'}`);

      // Large games
      const allowLargeGames = document.getElementById('allowLargeGames').checked;
      summary.push(`👥 Max Players: ${allowLargeGames ? '10 (large game mode)' : '6 (standard)'}`);

      document.getElementById('summaryText').innerHTML = summary.map(s => `<div>${s}</div>`).join('');
    }

    function createGame() {
      // Validate password if enabled
      const passwordEnabled = document.getElementById('passwordEnabled').checked;
      let password = null;

      if (passwordEnabled) {
        password = document.getElementById('gamePassword').value.trim();
        if (!password || password.length < 4) {
          alert('Password must be at least 4 characters');
          return;
        }
      }

      // Get settings
      const settings = {
        gameName: document.getElementById('gameName').value.trim() || null,
        useInquisitor: gameMode === 'inquisitor',
        allowSpectators: document.getElementById('allowSpectators').checked,
        chatMode: document.getElementById('chatMode').value,
        password: password,
        ranked: document.getElementById('rankedMode').checked,
        anonymousMode: document.getElementById('anonymousMode').checked,
        allowLargeGames: document.getElementById('allowLargeGames').checked
      };

      // Store in localStorage
      localStorage.setItem('coupGameSettings', JSON.stringify(settings));

      // Redirect to game interface
      window.location.href = '/game.html';
    }

    // Add change listeners to update summary
    document.getElementById('allowSpectators').addEventListener('change', () => {
      updateChatOptions();
      updateSummary();
    });
    document.getElementById('chatMode').addEventListener('change', updateSummary);
    document.getElementById('rankedMode').addEventListener('change', updateSummary);
    document.getElementById('anonymousMode').addEventListener('change', updateSummary);
    document.getElementById('allowLargeGames').addEventListener('change', updateSummary);

    function updateChatOptions() {
      const allowSpectators = document.getElementById('allowSpectators').checked;
      const chatMode = document.getElementById('chatMode');
      const currentValue = chatMode.value;

      chatMode.innerHTML = allowSpectators
        ? `<option value="separate">Separate Chats</option>
           <option value="unified">Unified Chat</option>
           <option value="none">No Chat</option>`
        : `<option value="unified">Player Chat</option>
           <option value="none">Disabled</option>`;

      // Preserve selection if still valid, otherwise default
      if ([...chatMode.options].some(o => o.value === currentValue)) {
        chatMode.value = currentValue;
      }
    }

    // Initialize
    updateChatOptions();
    updateSummary();

    // Socket.io connection for online user tracking
    const script = document.createElement('script');
    script.src = '/socket.io/socket.io.js';
    script.onload = () => {
      const authToken = localStorage.getItem('coupAuthToken');
      const socket = io({
        auth: { token: authToken }
      });

      socket.on('connect', () => {
        // For guests, get username from localStorage
        const guestUsername = localStorage.getItem('coupGuestUsername');
        // Server will use authenticatedUser.username if token is valid, otherwise uses this
        socket.emit('joinLobby', { username: guestUsername });
      });
    };
    document.head.appendChild(script);
  </script>
</body>
</html>
